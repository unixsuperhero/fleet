add_newline = false
format = '[\[](bold fg:#3b82f6 bg:#0b1220)[ STUDIO ](bold fg:#67e8f9 bg:#0b1220)[\]](bold fg:#3b82f6 bg:#0b1220) $time $git_commit$directory${custom.tmux}$git_branch$git_status$ruby$cmd_duration$line_break[| ](bold fg:#3b82f6)$character'

[character]
success_symbol = '[>](bold fg:#67e8f9)'
error_symbol = '[x>](bold fg:#fb7185)'
vimcmd_symbol = '[<](bold fg:#67e8f9)'
vimcmd_replace_one_symbol = '[<](bold fg:#fbbf24)'
vimcmd_replace_symbol = '[<](bold fg:#3b82f6)'
vimcmd_visual_symbol = '[<](bold fg:#38bdf8)'

[time]
disabled = false
time_format = '%Y%m%d %H%M%S'
format = '[$time]($style)'
style = 'fg:#94a3b8'

[git_commit]
commit_hash_length = 8
only_detached = false
format = '[$hash$tag ]($style)'
style = 'bold fg:#60a5fa'
tag_symbol = ' tag:'

[directory]
truncation_length = 8
truncate_to_repo = false
truncation_symbol = '.../'
home_symbol = '~'
read_only = ' RO'
format = '[$path]($style)[$read_only]($read_only_style) '
style = 'bold fg:#67e8f9'
read_only_style = 'bold fg:#fb7185'

[custom.tmux]
description = 'Current tmux session name'
command = "tmux display-message -p '#S'"
when = '[ -n "$TMUX" ]'
format = '[tmux:$output]($style) '
style = 'bold fg:#38bdf8'

[git_branch]
symbol = 'git:'
truncation_symbol = '...'
format = '[$symbol$branch(:$remote_branch)]($style) '
style = 'bold fg:#60a5fa'

[git_status]
stashed = ''
conflicted = '='
deleted = 'x'
renamed = 'r'
modified = '!'
untracked = '?'
staged = '+'
format = '([$staged](bold fg:#34d399)[$conflicted$stashed$deleted$renamed$modified$untracked](bold fg:#fb7185) )'

[ruby]
symbol = 'ruby '
format = 'via [$symbol($version )]($style)'
style = 'bold fg:#fbbf24'

[cmd_duration]
min_time = 100_000
format = 'took [$duration]($style) '
style = 'fg:#93c5fd'
