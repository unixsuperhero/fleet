[package]
name = "fleet"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
default-run = "fleet"
description = "Independent local-first SSH fleet terminals"

[lib]
name = "fleet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "fleet"
path = "src/main.rs"

[[bin]]
name = "bindings"
path = "src/bin/bindings.rs"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
tauri-plugin-dialog = "=2.8.2"
tauri-plugin-opener = "=2.7.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
ts-rs = { version = "=11.1.0", features = ["uuid-impl"] }
uuid = { version = "=1.18.1", features = ["serde", "v4"] }
chrono = { version = "=0.4.42", features = ["serde"] }
libc = "=0.2.177"
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
zeroize = { version = "=1.8.2", features = ["derive"] }
tempfile = "=3.23.0"
sha2 = "=0.10.9"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
